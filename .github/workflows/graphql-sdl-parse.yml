name: Template literals + GraphQL SDL

# Two checks, in one script, in the order the second one needs.
#
# FIRST (#1076): the SDL template literal is intact. A bare backtick
# inside a GraphQL description or `#` comment terminates it, and the
# TypeScript error that follows names a field as though it were a
# statement, sometimes hundreds of lines from the cause. This half
# reads the file as text and names the offending line. It runs first
# because the parse below cannot IMPORT a module the backtick broke
# — which is also why that import is dynamic.
#
# FIRST-B (#1087): the SAME hazard in every TAGGED prose-carrying
# literal — $queryRaw / $executeRaw / Prisma.sql — across all of
# src/. The hazard was never SDL; #1076 was scoped to where its
# author had been bitten, and the identical trap landed in a SQL
# comment an hour after it merged. This is why the path filter below
# is src/**.ts and not the schema directory: a widened guard behind
# a narrow trigger is a guard that does not run.
#
# THIRD (#1103): SDL DESCRIPTIONS agree with the code they describe.
# Nothing ever checked one, and four instances of that drift reached
# the PUBLISHED reference before this existed — the motivating one
# enumerated four of five grant scopes in a document that named the
# fifth three fields away, and a hand-written docs page copied the
# wrong half. A description is a published surface, so its staleness
# is a defect in the product, not in a comment.
#
# It lives in this workflow rather than its own because the trigger
# is identical (typeDefs.ts plus the constants it describes) and a
# guard behind a second, narrower trigger is a guard that does not
# run — the #1087 lesson one line up.
#
# SECOND: the SDL parses.
# Imports the `typeDefs` template literal from
# `src/api/graphql/schema/typeDefs.ts` and runs `graphql.parse()` on
# it. Catches the class of bug from PR #136: two adjacent
# `"""docstring"""` blocks on the same definition silently merged
# into a syntactically-invalid SDL. tsc treats the template literal
# as opaque; the test suite doesn't necessarily import typeDefs in
# a path that triggers SDL parse at module load; the runtime parse
# only fires on first `makeExecutableSchema` / Apollo init, which
# can be at process boot. Result: bad SDL survives every other gate
# and surfaces in production as a boot loop.

on:
  pull_request:
    paths:
      # #1087: all of src/, not just the schema dir — $queryRaw lives
      # wherever its query does.
      - 'src/**.ts'
      - 'scripts/check-graphql-sdl.mjs'
      - 'scripts/check-sdl-enumerations.mjs'
      - '.github/workflows/graphql-sdl-parse.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - 'src/**.ts'
      - 'scripts/check-graphql-sdl.mjs'
      - 'scripts/check-sdl-enumerations.mjs'
      - '.github/workflows/graphql-sdl-parse.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  graphql-sdl-parse:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts loader requires DATABASE_URL even though
      # nothing here connects to a DB. Dummy value; mirrors tsc.yml.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4

      # No `version:` — read from package.json `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # The Prisma client is imported transitively through some of
      # the GraphQL schema neighbors; generate it so the SDL module
      # can resolve without crashing on a missing client.
      - run: pnpm prisma generate

      - name: Check the SDL literal, then parse the SDL
        run: pnpm tsx scripts/check-graphql-sdl.mjs

      - name: SDL descriptions agree with the code they enumerate (#1103)
        run: pnpm check:sdl-enums
