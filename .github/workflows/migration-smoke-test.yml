name: Migration Smoke Test

# Catches the failure mode that bit spec 005-agent-subscription:
# a migration that *looks* fine when applied via `prisma db push`
# (which bypasses the migration engine) but fails under the actual
# `prisma migrate deploy` path that production runs.
#
# Strategy: simulate a real prod-like apply by setting up a DB
# matching `origin/main` (via db push + main's raw SQL invariants + marking
# main's migrations applied), then running `prisma migrate deploy` to apply only
# the *new* migrations introduced in this PR.

on:
  pull_request:
    paths:
      - 'prisma/migrations/**'
      - 'prisma/schema.prisma'
      - '.github/workflows/migration-smoke-test.yml'
      - '.github/scripts/migration-baseline.sh'
      - 'prisma/runtime-role.sql'
      - 'scripts/db/**'
  push:
    branches: [main]
    paths:
      - 'prisma/migrations/**'
      - 'prisma/schema.prisma'
      - '.github/workflows/migration-smoke-test.yml'
      - '.github/scripts/migration-baseline.sh'
      - 'prisma/runtime-role.sql'
      - 'scripts/db/**'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hadron_smoke
    services:
      postgres:
        # 033-rag-vector-retrieval: pgvector-bearing image (postgres:16 + pgvector)
        # so `CREATE EXTENSION vector` works in CI. Same PG16, data-compatible.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hadron_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history so we can checkout origin/main

      # No `version:` — read from package.json `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Stash PR's prisma/ and apply main's schema
        id: baseline
        run: .github/scripts/migration-baseline.sh

      - name: Apply PR's new migrations via prisma migrate deploy
        run: pnpm prisma migrate deploy

      - name: Verify migrations and schema.prisma agree
        run: |
          # The migrations directory and schema.prisma must agree:
          # applying all migrations should produce exactly the schema
          # described by schema.prisma. Any non-empty diff means
          # someone updated schema.prisma without generating a matching
          # migration (or vice versa) — the kind of drift that quietly
          # breaks production deploys.
          #
          # Known acceptable drift (Prisma schema-language limitations):
          #   - `memories_user_id_idx` and
          #     `users_external_app_id_external_id_key` are partial
          #     indexes (WHERE clause) in the DB, which Prisma can't
          #     express in `schema.prisma`. The diff therefore wants
          #     to "fix" them into non-partial form on every run.
          #   - The "-- CreateIndex" comment that accompanies them.
          #   - 033: `node_embeddings_embedding_hnsw` is a pgvector HNSW
          #     index, which Prisma can't express, so the diff wants to
          #     DROP it. It must live in the migration (prod needs it and
          #     prod doesn't run post-push.sql), so it's whitelisted here.
          #   - cor:api:090 (findNodes): `nodes.tsv` is a STORED generated
          #     tsvector column and `nodes_tsv_gin` its GIN index — Prisma
          #     models neither, so the diff wants to DROP the column + index.
          #     Same rationale as the HNSW index (prod needs them, prod doesn't
          #     run post-push.sql); both are whitelisted, incl. the -- AlterTable
          #     comment that accompanies the column drop.
          #   - #719 (where-query): `nodes_properties_gin` / `nodes_data_gin` are
          #     GIN(jsonb_path_ops) indexes Prisma can't express, so the diff wants
          #     to DROP them. Same rationale (prod needs them, no post-push.sql on
          #     prod); both are whitelisted.
          #   - #2553: `agent_tasks.task_number` / `handle` are NOT NULL in the DB
          #     (the invariants file, so no row ever lacks its identity) but optional
          #     in schema.prisma, so a writer that states neither still type-checks
          #     and the assign-number trigger fills them. The diff wants to DROP
          #     NOT NULL; both lines are whitelisted.
          #   - #2047: `served_prompts` owner-consistency foreign keys (chat, run
          #     and session owner) and the `app_runs` / `sessions` unique indexes
          #     they target are database facts (prisma/served-prompt-invariants.sql,
          #     composite keys Prisma cannot model against a polymorphic owner), so
          #     the diff wants to DROP them; the five lines and their
          #     `-- DropForeignKey` comment are whitelisted.
          # Any OTHER line in the diff is real drift and must fail CI.
          # Invoke the prisma bin directly (not `pnpm prisma`): pnpm 11's
          # verify-deps-before-run preamble ("Already up to date" / "Done
          # in ...") would land in the captured output and read as drift.
          DIFF=$(node_modules/.bin/prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script 2>&1 \
            | grep -vE "^Loaded|^Prisma config|^$" \
            | grep -vE '^(Already up to date|Done in .*)$' \
            | grep -vE '^-- (CreateIndex|DropIndex|AlterTable|DropForeignKey)$' \
            | grep -vE '^CREATE INDEX "memories_user_id_idx" ON "memories"\("user_id"\);$' \
            | grep -vE '^CREATE UNIQUE INDEX "users_external_app_id_external_id_key" ON "users"\("external_app_id", "external_id"\);$' \
            | grep -vE '^DROP INDEX "node_embeddings_embedding_hnsw";$' \
            | grep -vE '^DROP INDEX "nodes_tsv_gin";$' \
            | grep -vE '^ALTER TABLE "nodes" DROP COLUMN "tsv";$' \
            | grep -vE '^DROP INDEX "nodes_properties_gin";$' \
            | grep -vE '^DROP INDEX "nodes_data_gin";$' \
            | grep -vE '^ALTER TABLE "agent_tasks" ALTER COLUMN "task_number" DROP NOT NULL,$' \
            | grep -vE '^ALTER COLUMN "handle" DROP NOT NULL;$' \
            | grep -vE '^ALTER TABLE "served_prompts" DROP CONSTRAINT "served_prompts_(chat|run_owner|session_owner)_fkey";$' \
            | grep -vE '^DROP INDEX "(app_runs|sessions)_served_prompt_owner_uniq";$' \
            || true)
          # `|| true`: when every diff line is whitelisted the final grep matches
          # nothing and exits 1, which under `bash -e` would fail the job. An empty
          # DIFF means "no drift" — the `-n` test below handles it as success.
          if [ -n "$DIFF" ] && [ "$DIFF" != "-- This is an empty migration." ]; then
            echo "::error::Schema drift between migrations and schema.prisma:"
            echo "$DIFF"
            exit 1
          fi
          echo "OK — migrations produce schema.prisma (modulo known partial-index drift)."

  # #2413 S3 (plan section 3.6): the same production path (`migrate deploy`), but the database is owned by a
  # NON-SUPERUSER migrator and served by a NON-OWNER role, so a migration that adds a table or object the serve
  # role cannot use fails here, before production. The grants file refuses a superuser runner, so `postgres` is
  # used only to create roles and databases; everything else runs as the migrator.
  serve-role-smoke:
    runs-on: ubuntu-latest
    env:
      ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # The migrator: owns every relation. DATABASE_URL is what baseline/migrate/prisma read.
      DATABASE_URL: postgresql://hadron_owner:owner_pw@localhost:5432/hadron_serve_smoke
      MIGRATE_DATABASE_URL: postgresql://hadron_owner:owner_pw@localhost:5432/hadron_serve_smoke
      OWNER_URL: postgresql://hadron_owner:owner_pw@localhost:5432/hadron_serve_smoke
      SERVE_URL: postgresql://hadron_app:serve_pw@localhost:5432/hadron_serve_smoke
      SERVE_DATABASE_URL: postgresql://hadron_app:serve_pw@localhost:5432/hadron_serve_smoke
      SERVE_ROLE: hadron_app
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Create the migrator, the serve role and the database (as postgres)
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -q \
            -c "CREATE ROLE hadron_owner LOGIN NOSUPERUSER PASSWORD 'owner_pw'" \
            -c "CREATE ROLE hadron_app LOGIN NOSUPERUSER PASSWORD 'serve_pw'" \
            -c "CREATE DATABASE hadron_serve_smoke OWNER hadron_owner"
          # CREATE EXTENSION vector needs a superuser; the migrator never does it in production either.
          psql "postgresql://postgres:postgres@localhost:5432/hadron_serve_smoke" -v ON_ERROR_STOP=1 -q \
            -c 'CREATE EXTENSION IF NOT EXISTS vector'

      - name: Stash PR's prisma/ and apply main's schema (as the migrator)
        run: .github/scripts/migration-baseline.sh

      # Role BEFORE the PR's migrations: the grants file and its default privileges are already in place when
      # `migrate deploy` creates anything new, which is exactly the production order after cutover.
      - name: Apply the grants as the migrator, then verify
        run: |
          psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f prisma/runtime-role.sql
          pnpm -s tsx scripts/db/verify-runtime-role.ts

      - name: Apply PR's new migrations via prisma migrate deploy (as the migrator)
        run: pnpm prisma migrate deploy

      - name: Verify the serve role after the migrations
        run: pnpm -s tsx scripts/db/verify-runtime-role.ts

      - name: Serve-role smoke (role before migrate)
        run: pnpm -s tsx scripts/db/serve-role-smoke.ts

      # Migrate-before-role: the order of a database that was migrated first. The grants file is idempotent.
      - name: Re-apply the grants after migrate, verify and smoke again
        run: |
          psql "$MIGRATE_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f prisma/runtime-role.sql
          pnpm -s tsx scripts/db/verify-runtime-role.ts
          pnpm -s tsx scripts/db/serve-role-smoke.ts

      - name: Fresh database, role before the first migrate (ledger hazard)
        run: scripts/db/serve-role-lane.sh fresh-order

      - name: Mutation proof (the lane must fail when the grants file is weakened)
        run: scripts/db/serve-role-lane.sh mutants
