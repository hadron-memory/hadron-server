name: Migration Smoke Test

# Catches the failure mode that bit spec 005-agent-subscription:
# a migration that *looks* fine when applied via `prisma db push`
# (which bypasses the migration engine) but fails under the actual
# `prisma migrate deploy` path that production runs.
#
# Strategy: simulate a real prod-like apply by setting up a DB
# matching `origin/main` (via db push + main's raw SQL invariants + marking
# main's migrations applied), then running `prisma migrate deploy` to apply only
# the *new* migrations introduced in this PR.

on:
  pull_request:
    paths:
      - 'prisma/migrations/**'
      - 'prisma/schema.prisma'
      - '.github/workflows/migration-smoke-test.yml'
  push:
    branches: [main]
    paths:
      - 'prisma/migrations/**'
      - 'prisma/schema.prisma'
      - '.github/workflows/migration-smoke-test.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hadron_smoke
    services:
      postgres:
        # 033-rag-vector-retrieval: pgvector-bearing image (postgres:16 + pgvector)
        # so `CREATE EXTENSION vector` works in CI. Same PG16, data-compatible.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hadron_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history so we can checkout origin/main

      # No `version:` — read from package.json `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Stash PR's prisma/ and apply main's schema
        id: baseline
        run: |
          # Save PR state, restore main's prisma/ for baseline setup.
          # Note: `git checkout origin/main -- prisma/` only restores files
          # that exist on main. Migration directories newly added on the PR
          # branch would survive and pollute the seeding loop below — they'd
          # be pre-marked as applied and `migrate deploy` would no-op.
          # `rm -rf prisma` first so only main's files remain.
          mkdir -p /tmp/pr-prisma
          cp -r prisma /tmp/pr-prisma/
          rm -rf prisma
          git checkout origin/main -- prisma/
          pnpm prisma db push --skip-generate --accept-data-loss
          # db push omits functions/triggers/CHECKs from already-applied SQL
          # migrations. Restore MAIN's invariants before claiming its migration
          # list is applied, so a new migration may depend on those objects.
          # This must run before restoring the PR tree below: replaying PR SQL
          # here would mask defects in the migration being tested.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/post-push.sql

          # Seed `_prisma_migrations` with main's migration list so
          # Prisma considers them already-applied. PSQL is available
          # via the postgres service.
          psql "$DATABASE_URL" -c "
            CREATE TABLE IF NOT EXISTS \"_prisma_migrations\" (
              id VARCHAR(36) PRIMARY KEY NOT NULL,
              checksum VARCHAR(64) NOT NULL,
              finished_at TIMESTAMPTZ,
              migration_name VARCHAR(255) NOT NULL,
              logs TEXT,
              rolled_back_at TIMESTAMPTZ,
              started_at TIMESTAMPTZ NOT NULL DEFAULT now(),
              applied_steps_count INTEGER NOT NULL DEFAULT 0
            );"
          for m in prisma/migrations/*/; do
            name=$(basename "$m")
            [ "$name" = "migration_lock.toml" ] && continue
            checksum=$(sha256sum "$m/migration.sql" | awk '{print $1}')
            psql "$DATABASE_URL" -c \
              "INSERT INTO \"_prisma_migrations\" (id, checksum, finished_at, migration_name, applied_steps_count)
               VALUES (gen_random_uuid()::text, '$checksum', now(), '$name', 1);" >/dev/null
          done

          # Restore PR's prisma/ for the deploy step
          rm -rf prisma
          mv /tmp/pr-prisma/prisma .

      - name: Apply PR's new migrations via prisma migrate deploy
        run: pnpm prisma migrate deploy

      - name: Verify migrations and schema.prisma agree
        run: |
          # The migrations directory and schema.prisma must agree:
          # applying all migrations should produce exactly the schema
          # described by schema.prisma. Any non-empty diff means
          # someone updated schema.prisma without generating a matching
          # migration (or vice versa) — the kind of drift that quietly
          # breaks production deploys.
          #
          # Known acceptable drift (Prisma schema-language limitations):
          #   - `memories_user_id_idx` and
          #     `users_external_app_id_external_id_key` are partial
          #     indexes (WHERE clause) in the DB, which Prisma can't
          #     express in `schema.prisma`. The diff therefore wants
          #     to "fix" them into non-partial form on every run.
          #   - The "-- CreateIndex" comment that accompanies them.
          #   - 033: `node_embeddings_embedding_hnsw` is a pgvector HNSW
          #     index, which Prisma can't express, so the diff wants to
          #     DROP it. It must live in the migration (prod needs it and
          #     prod doesn't run post-push.sql), so it's whitelisted here.
          #   - cor:api:090 (findNodes): `nodes.tsv` is a STORED generated
          #     tsvector column and `nodes_tsv_gin` its GIN index — Prisma
          #     models neither, so the diff wants to DROP the column + index.
          #     Same rationale as the HNSW index (prod needs them, prod doesn't
          #     run post-push.sql); both are whitelisted, incl. the -- AlterTable
          #     comment that accompanies the column drop.
          #   - #719 (where-query): `nodes_properties_gin` / `nodes_data_gin` are
          #     GIN(jsonb_path_ops) indexes Prisma can't express, so the diff wants
          #     to DROP them. Same rationale (prod needs them, no post-push.sql on
          #     prod); both are whitelisted.
          # Any OTHER line in the diff is real drift and must fail CI.
          # Invoke the prisma bin directly (not `pnpm prisma`): pnpm 11's
          # verify-deps-before-run preamble ("Already up to date" / "Done
          # in ...") would land in the captured output and read as drift.
          DIFF=$(node_modules/.bin/prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script 2>&1 \
            | grep -vE "^Loaded|^Prisma config|^$" \
            | grep -vE '^(Already up to date|Done in .*)$' \
            | grep -vE '^-- (CreateIndex|DropIndex|AlterTable)$' \
            | grep -vE '^CREATE INDEX "memories_user_id_idx" ON "memories"\("user_id"\);$' \
            | grep -vE '^CREATE UNIQUE INDEX "users_external_app_id_external_id_key" ON "users"\("external_app_id", "external_id"\);$' \
            | grep -vE '^DROP INDEX "node_embeddings_embedding_hnsw";$' \
            | grep -vE '^DROP INDEX "nodes_tsv_gin";$' \
            | grep -vE '^ALTER TABLE "nodes" DROP COLUMN "tsv";$' \
            | grep -vE '^DROP INDEX "nodes_properties_gin";$' \
            | grep -vE '^DROP INDEX "nodes_data_gin";$' \
            || true)
          # `|| true`: when every diff line is whitelisted the final grep matches
          # nothing and exits 1, which under `bash -e` would fail the job. An empty
          # DIFF means "no drift" — the `-n` test below handles it as success.
          if [ -n "$DIFF" ] && [ "$DIFF" != "-- This is an empty migration." ]; then
            echo "::error::Schema drift between migrations and schema.prisma:"
            echo "$DIFF"
            exit 1
          fi
          echo "OK — migrations produce schema.prisma (modulo known partial-index drift)."
