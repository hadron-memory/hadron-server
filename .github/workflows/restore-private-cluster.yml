name: Restore private cluster

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: restore-private-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore-private-cluster:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ['16', '17']
    env:
      REQUIRE_PRIVATE_CLUSTER: '1'
      PRIVATE_CLUSTER_PG_VERSION: ${{ matrix.pg }}
      # Prisma generation needs a syntactically valid URL; the suite creates all
      # of its own databases on fresh private ports and never connects to this.
      DATABASE_URL: postgresql://postgres@127.0.0.1/unused
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      # PGDG's signed repository supplies server binaries AND matching vector.
      # https://www.postgresql.org/download/linux/ubuntu/
      - name: Install PostgreSQL ${{ matrix.pg }} and pgvector
        env:
          PG_MAJOR: ${{ matrix.pg }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          # Bounded retry for transient transport faults (#4262: curl 56 on this
          # download, green on rerun). 5 retries with curl's doubling backoff,
          # 10 s to connect and 60 s per attempt, and at most 180 s of retrying
          # in total; a persistent failure still exits nonzero and fails the job.
          sudo curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-max-time 180 \
            --connect-timeout 10 --max-time 60 \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          # apt's own per-download retry for the same class of fault on the
          # repository fetches that follow.
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y "postgresql-$PG_MAJOR" "postgresql-$PG_MAJOR-pgvector"
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - name: Run restore assertions and regression pins (PostgreSQL ${{ matrix.pg }})
        env:
          # runner context is available at step scope; fixtures belong on disk.
          TMPDIR: ${{ runner.temp }}
        run: pnpm exec vitest run --config scripts/ops/vitest.private.config.ts
