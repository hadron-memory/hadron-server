name: Unit Tests

# Runs the full vitest suite on every PR + every push to main. The
# parent issue (#148) was filed because the suite drifted to 67
# failures across 12 files over four spec-025 PRs without anyone
# noticing — nothing in CI was treating unit-test failures as
# blocking. This workflow is the lasting fix (#176): once configured
# as a required status check on `main`, any new red breaks the merge
# button and stays surfaced.
#
# The suite is SHARDED across N parallel jobs (`vitest run --shard=i/N`).
# GitHub's ubuntu-latest runners are only ~2 cores, so the in-process
# per-worker-DB parallelism (perWorkerDb.ts) barely helps here — splitting
# the FILES across separate runners is what cuts CI wall-time. Each shard
# gets its own Postgres service + template DB. The required status check
# stays named `test` via the aggregation gate job at the bottom, so the
# matrix change doesn't break branch protection.

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same ref. Saves
# runner minutes on iterative pushes and gets feedback faster.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # These regressions use node:test and are deliberately excluded from Vitest.
  # Their fixtures stub stack commands; no Docker, database or install is needed.
  node-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run disposable-stack Node regressions
        run: node --test scripts/e2e/*.test.mjs

  test-shard:
    runs-on: ubuntu-latest
    # GH default job timeout is 6 hours — a hung vitest worker or
    # deadlocked postgres connection would consume it before failing.
    # A shard runs a quarter of the suite. #2776: 20 minutes cancelled slow
    # but healthy runs (15-23 min per shard on the private mirror's hosted
    # runners), so the cap is 40: room for a slow run, still a hard stop
    # for a real hang long before the 6-hour default.
    timeout-minutes: 40
    strategy:
      # Don't cancel the other shards when one fails — surface every shard's
      # results so a failure isn't masked by a sibling shard's early exit.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Used by `prisma db push` below. The vitest config reads
      # `TEST_DATABASE_URL` (also set below) for the test runner's
      # own connection.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hadron_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hadron_test
    services:
      postgres:
        # 033-rag-vector-retrieval: pgvector-bearing image (postgres:16 + pgvector)
        # so `CREATE EXTENSION vector` works in CI. Same PG16, data-compatible.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hadron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup@v4 reads `packageManager` from
      # package.json. Keeps CI, Docker, and local dev on one pnpm version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      # No schema step (#1922): the vitest globalSetup builds the test template
      # itself, from an empty database, for this checkout's schema fingerprint
      # (src/test/schemaTemplate.ts). Pushing to `hadron_test` here would build
      # a database the parallel suite never reads.

      - name: Run vitest suite (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        # Go through the `pnpm test` script (= `vitest run`) so CI can't drift
        # from it. `--shard=i/N` deterministically splits the test FILES into N
        # slices and runs slice i here; a non-zero exit fails the job. NOTE: the
        # flag is passed WITHOUT a `--` separator — `pnpm test -- --shard=…`
        # drops the arg in pnpm 11 and silently runs the whole suite.
        run: pnpm test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # Aggregation gate: a single stable check named `test` that passes iff every
  # shard and the Node regressions passed. Keep THIS as the required status check
  # on `main` (individual jobs don't need to be separately required).
  test:
    needs: [test-shard, node-regressions]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all test jobs to pass
        run: |
          echo "test-shard aggregate result: ${{ needs.test-shard.result }}"
          test "${{ needs.test-shard.result }}" = "success"
          echo "node-regressions result: ${{ needs.node-regressions.result }}"
          test "${{ needs.node-regressions.result }}" = "success"
