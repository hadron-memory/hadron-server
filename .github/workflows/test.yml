name: Unit Tests

# Runs the full vitest suite on every PR + every push to main. The
# parent issue (#148) was filed because the suite drifted to 67
# failures across 12 files over four spec-025 PRs without anyone
# noticing — nothing in CI was treating unit-test failures as
# blocking. This workflow is the lasting fix (#176): once configured
# as a required status check on `main`, any new red breaks the merge
# button and stays surfaced.
#
# The suite is SHARDED across N parallel jobs (`vitest run --shard=i/N`).
# GitHub's ubuntu-latest runners are only ~2 cores, so the in-process
# per-worker-DB parallelism (perWorkerDb.ts) barely helps here — splitting
# the FILES across separate runners is what cuts CI wall-time. Each shard
# gets its own Postgres service + template DB. The required status check
# stays named `test` via the aggregation gate job at the bottom, so the
# matrix change doesn't break branch protection.

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same ref. Saves
# runner minutes on iterative pushes and gets feedback faster.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-shard:
    runs-on: ubuntu-latest
    # GH default job timeout is 6 hours — a hung vitest worker or
    # deadlocked postgres connection would consume it before failing.
    # A shard runs a quarter of the suite; 20 minutes is generous cover
    # for CI cold starts (install + prisma generate + db setup).
    timeout-minutes: 20
    strategy:
      # Don't cancel the other shards when one fails — surface every shard's
      # results so a failure isn't masked by a sibling shard's early exit.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Used by `prisma db push` below. The vitest config reads
      # `TEST_DATABASE_URL` (also set below) for the test runner's
      # own connection.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hadron_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hadron_test
    services:
      postgres:
        # 033-rag-vector-retrieval: pgvector-bearing image (postgres:16 + pgvector)
        # so `CREATE EXTENSION vector` works in CI. Same PG16, data-compatible.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hadron_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup@v4 reads `packageManager` from
      # package.json. Keeps CI, Docker, and local dev on one pnpm version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm prisma generate

      - name: Sync test DB schema (db push + post-push.sql)
        # `prisma db push` creates tables/columns/indexes but skips CHECK
        # constraints (Prisma's schema language doesn't model them).
        # `prisma/post-push.sql` adds the spec-005 / spec-008 / spec-023
        # CHECKs the tests depend on. The vitest globalSetup also adds a
        # subset of these IF NOT EXISTS; running post-push.sql first
        # ensures the complete set lands in the canonical post-023 form.
        # This builds the `hadron_test` TEMPLATE that perWorkerDb.ts clones.
        run: |
          pnpm prisma db push --skip-generate
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/post-push.sql

      - name: Run vitest suite (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        # `vitest run --shard=i/N` deterministically splits the test FILES
        # into N slices and runs slice i here. A non-zero exit fails the job.
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # Aggregation gate: a single stable check named `test` that passes iff every
  # shard passed. Keep THIS as the required status check on `main` (matrix jobs
  # report as `test-shard (1..4)` and don't need to be individually required).
  test:
    needs: [test-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all shards to pass
        run: |
          echo "test-shard aggregate result: ${{ needs.test-shard.result }}"
          test "${{ needs.test-shard.result }}" = "success"
