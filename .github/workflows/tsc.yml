name: TypeScript Type Check

# Runs `tsc --noEmit` on every PR + every push to main.
#
# Catches type regressions that bypass author-side checks — e.g., the
# pre-023 `App.urn` partial-unique drift in `src/lib/entityRef/appRef.ts`
# that survived multiple PRs before being noticed. Prisma's `include`
# typing is loose, so runtime-only crashes (App.agent on a dropped
# relation) can also slip past local `tsc` runs that were stale on the
# Prisma client; the `prisma generate` step here regenerates the client
# from `schema.prisma` first to give a fresh baseline.

on:
  # No `paths:` filter, on purpose (#4819). `tsc` is a REQUIRED check: a required check that a path filter keeps from
  # running never reports, so every PR touching no .ts/lock/schema file would wait on it forever, and a merge queue
  # entry the same way. A type error also does not stay in the files that changed (#4706 with #4696). The job takes
  # about 3 minutes, so running it always costs less than reasoning about when it can be skipped.
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# A queue entry (merge_group) has no PR number, so it gets its own group and is never cancelled; see CLAUDE.md, Merge notes (#4819).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tsc:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts loader requires DATABASE_URL even though
      # `prisma generate` doesn't connect to the DB. Dummy value;
      # no actual connection is attempted.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4

      # No `version:` — read from package.json `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Regenerate the Prisma client from the current schema.prisma so
      # type checks run against the post-PR shape, not a stale client
      # cached from a previous branch.
      - run: pnpm prisma generate

      - name: tsc --noEmit
        env:
          # The full source + test graph exceeds Node's default 2 GiB heap. 4 GiB stopped being enough
          # on 2026-11-03: main itself measured 4.56 GB peak (`tsc --extendedDiagnostics`, Memory used),
          # so any PR adding a model tipped it over (#3298). 6 GiB fits the 16 GB public-repo runner.
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm tsc --noEmit -p .
