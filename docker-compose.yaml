services:
  db:
    # 033-rag-vector-retrieval: pgvector-bearing image (drop-in for postgres:17;
    # data-compatible). Required for `CREATE EXTENSION vector`. NB: a system
    # Postgres (non-docker) instead needs the `postgresql-17-pgvector` package.
    image: pgvector/pgvector:pg17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hadron
      POSTGRES_USER: hadron
      POSTGRES_PASSWORD: hadron
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hadron"]
      interval: 5s
      timeout: 5s
      retries: 10

  # #5167 (Holger, 2026-11-28: SeaweedFS): the local dev object store, S3-compatible, Apache-2.0. It replaced MinIO, whose
  # upstream is archived and whose images stopped pulling anonymously. Pinned by digest (release 4.55). Host port 9000
  # maps to SeaweedFS's S3 port 8333, so a dev `.env` with ASSET_STORAGE_ENDPOINT=http://localhost:9000 keeps working.
  # Credentials: scripts/objectstore/seaweedfs-s3.json (dev-only values). Production storage (Hetzner) is unrelated.
  s3:
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    container_name: hadron-s3
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "9000:8333"
    volumes:
      - seaweedfs_data:/data
      - ./scripts/objectstore/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    # /healthz answers on the S3 port once the gateway serves; the image ships curl, so no `mc` is needed.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot init: create the bucket and apply CORS for the portal origin (scripts/objectstore/seaweedfs-init.sh, run in
  # the same image, whose curl signs SigV4). Fails loudly if the CORS rule does not apply.
  s3-init:
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    container_name: hadron-s3-init
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ["sh", "/init/seaweedfs-init.sh"]
    environment:
      S3_URL: http://s3:8333
      S3_ACCESS_KEY: hadron-dev
      S3_SECRET_KEY: hadron-dev-secret
      S3_BUCKET: hadron-assets-dev
      S3_CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./scripts/objectstore/seaweedfs-init.sh:/init/seaweedfs-init.sh:ro

  # 039 Phase 1 — platform message bus (NATS JetStream, `-js`). Dev-only
  # convenience: the server runs standalone without it (NATS_URL unset →
  # sweep-loop fallbacks, D-2026-06-17-004). Point the app at it with
  # NATS_URL=nats://localhost:4222 (host) / nats://nats:4222 (compose).
  # 8222 is the HTTP monitoring endpoint.
  nats:
    # Pinned to the exact alpha version (bare-metal nats-server 2.10.27) so
    # local behavior can't drift from what production runs.
    image: nats:2.10.27-alpine
    container_name: hadron-nats
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  app:
    container_name: hadron-controller
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://hadron:hadron@db:5432/hadron
      PORT: 4000
      NODE_ENV: production
      GRAPHS_PATH: /var/lib/hadron/graphs
    volumes:
      - graphs:/var/lib/hadron/graphs
    env_file:
      - path: .env.localFs
        required: false   # place secrets (GITHUB_CLIENT_SECRET etc.) here
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  graphs:
  seaweedfs_data:
