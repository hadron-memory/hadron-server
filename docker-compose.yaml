services:
  db:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hadron
      POSTGRES_USER: hadron
      POSTGRES_PASSWORD: hadron
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hadron"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO substitutes for Cloudflare R2 in local dev (S3-compatible API).
  # Spec: specs/001-asset-upload/quickstart.md §2.
  # CORS for the portal origin is configured at first run via the init container below.
  minio:
    image: minio/minio:latest
    container_name: hadron-r2
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hadron-dev
      MINIO_ROOT_PASSWORD: hadron-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot init: create the bucket and apply CORS for the portal origin.
  minio-init:
    image: minio/mc:latest
    container_name: hadron-r2-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 hadron-dev hadron-dev-secret &&
      mc mb -p local/hadron-assets-dev &&
      mc anonymous set none local/hadron-assets-dev &&
      echo '{\"CORSRules\":[{\"AllowedOrigins\":[\"http://localhost:5173\"],\"AllowedMethods\":[\"PUT\",\"GET\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3600}]}' > /tmp/cors.json &&
      mc cors set local/hadron-assets-dev /tmp/cors.json || true
      "

  app:
    container_name: hadron-controller
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://hadron:hadron@db:5432/hadron
      PORT: 4000
      NODE_ENV: production
      GRAPHS_PATH: /var/lib/hadron/graphs
    volumes:
      - graphs:/var/lib/hadron/graphs
    env_file:
      - path: .env.localFs
        required: false   # place secrets (GITHUB_CLIENT_SECRET etc.) here
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  graphs:
  minio_data:
