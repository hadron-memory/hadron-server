services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U e2e -d e2e']
      interval: 2s
      timeout: 5s
      retries: 30
  app:
    build:
      context: ../..
      dockerfile: scripts/e2e/Dockerfile
    environment:
      DATABASE_URL: postgresql://e2e:e2e@db:5432/e2e
      NODE_ENV: development
      PORT: '4000'
      BASE_URL: http://localhost:${E2E_PORT:?set E2E_PORT}
      FRONTEND_URL: http://localhost:${E2E_PORTAL_PORT:?set E2E_PORTAL_PORT}
      DEV_LOGIN_ENABLED: 'true'
      E2E_SEED: 'true'
      RATE_LIMIT_KEYRING: ${E2E_RATE_LIMIT_KEYRING:-}
      # #5134: the deployment's default owner limits (JSON, see CLAUDE.md); empty counts as unset, so a stack is unlimited unless
      # `stack.sh up` ran with E2E_OWNER_DEFAULT_LIMITS='{"user":{"nodes":2000}}'. Read once at boot.
      OWNER_DEFAULT_LIMITS: ${E2E_OWNER_DEFAULT_LIMITS:-}
      # #5022: the default monthly grant (JSON of base-10 micro-cent strings, see CLAUDE.md); empty counts as unset, so a stack
      # grants nothing unless `stack.sh up` ran with E2E_OWNER_DEFAULT_MONTHLY_GRANT='{"user":"1000"}'. Read once at boot.
      OWNER_DEFAULT_MONTHLY_GRANT: ${E2E_OWNER_DEFAULT_MONTHLY_GRANT:-}
      # #2973 PR1 QA passthrough (private stacks only; all empty by default — no
      # default change): a signing-enabled stack is built by exporting these on
      # `stack.sh up`, e.g. E2E_PASSKEY_SIGNING_ENABLED=true
      # E2E_SIGNING_CEREMONY_ORIGINS=http://localhost:<portal-port>
      # E2E_PASSKEY_RP_ID=localhost. The stack is fresh-only (refuses a used one),
      # so they apply from first boot and the seeded DB is born under them.
      PASSKEY_SIGNING_ENABLED: ${E2E_PASSKEY_SIGNING_ENABLED:-}
      SIGNING_CEREMONY_ORIGINS: ${E2E_SIGNING_CEREMONY_ORIGINS:-}
      PASSKEY_RP_ID: ${E2E_PASSKEY_RP_ID:-}
      # #4058: registration rides signing (signingSurfacePolicy); with it on, an email link still signs the person in
      # (#4339: sign-in never depends on a passkey), which the seed pins. Export E2E_PASSKEY_REGISTRATION_ENABLED=true on `stack.sh up`.
      PASSKEY_REGISTRATION_ENABLED: ${E2E_PASSKEY_REGISTRATION_ENABLED:-}
      # #4624: off unless `stack.sh up` ran with E2E_RUN_WORKER=true (stack.sh maps it; anything else leaves this `true`).
      DISABLE_RUN_WORKER: ${E2E_DISABLE_RUN_WORKER:-true}
      DISABLE_SCHEDULER: 'true'
      GRAPHS_PATH: /var/lib/hadron/graphs
    ports:
      - '${E2E_BIND:-127.0.0.1}:${E2E_PORT}:4100'
    volumes:
      - graphs:/var/lib/hadron/graphs
      - credentials:/fixtures
    depends_on:
      db:
        condition: service_healthy
    # #3021: readiness, not liveness. /ready is 200 only once the first startup has succeeded and the database answers
    # (503 starting / startup_failed / stopping / database_unavailable otherwise; cor:api:270:01). /health stays 200
    # while a failed first startup leaves the process alive, so it must not gate `compose up --wait`.
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4100/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 60
volumes:
  db:
  graphs:
  credentials:
